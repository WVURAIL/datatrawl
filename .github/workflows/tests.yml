name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Check for Python static errors
        run: python -m ruff check src tests examples
      - name: Enforce the tested-code baseline
        run: python -m pytest -q --cov=datatrawl --cov-report=term-missing --cov-fail-under=80

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  lock-portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Exercise OS advisory product and survey locks
        run: >-
          python -m pytest -q
          tests/test_pipeline_regressions.py::test_output_lock_excludes_writer_through_final_save
          tests/test_survey_runtime_safety.py::test_active_survey_exclusively_owns_output_and_manifest

  # The user-facing analyzer template lives in its own repository. This job
  # runs the template's smoke suite against THIS datatrawl checkout, so a
  # datatrawl change that breaks the template fails here, not months later in
  # the template.
  template-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: WVURAIL/datatrawl-analyzer-template
          ref: d0fcbd44528bc46563cbeb8e28ba7ae26c00e5c0
          path: template
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # --no-deps so the template's public-baseline commit does not shadow the
      # checkout under test.
      - run: pip install --no-deps -e ./template
      - run: pytest -q template/tests

  release-artifacts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Check development and tagged-release version identity
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          with open("CITATION.cff", encoding="utf-8") as stream:
              citation_version = next(
                  line.split(":", 1)[1].strip().strip("'\"")
                  for line in stream
                  if line.startswith("version:")
              )
          assert citation_version == version, (
              f"CITATION.cff version {citation_version!r} does not match "
              f"package version {version!r}"
          )
          tags = subprocess.check_output(
              ["git", "tag", "--points-at", "HEAD"], text=True
          ).splitlines()
          version_tags = [
              tag for tag in tags
              if re.fullmatch(r"v?\d+\.\d+\.\d+(?:[A-Za-z0-9.+-]*)", tag)
          ]
          if version_tags:
              normalized = {tag.removeprefix("v") for tag in version_tags}
              assert version in normalized, (
                  f"package version {version!r} does not match HEAD tag(s) "
                  f"{version_tags!r}"
              )
          else:
              assert ".dev" in version, (
                  f"untagged commit must use a development version, got {version!r}"
              )
          PY
      - run: python -m build
      - run: python -m twine check dist/*

      - name: Install and test the wheel outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/datatrawl-wheel"
          "$RUNNER_TEMP/datatrawl-wheel/bin/python" -m pip install \
            dist/*.whl "pytest>=7"
          mkdir -p "$RUNNER_TEMP/wheel-suite"
          cp -R tests examples "$RUNNER_TEMP/wheel-suite/"
          cd "$RUNNER_TEMP/wheel-suite"
          "$RUNNER_TEMP/datatrawl-wheel/bin/python" -m pytest -q

      - name: Install and test the source distribution outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/datatrawl-sdist"
          "$RUNNER_TEMP/datatrawl-sdist/bin/python" -m pip install \
            dist/*.tar.gz "pytest>=7"
          mkdir -p "$RUNNER_TEMP/sdist-unpacked" "$RUNNER_TEMP/sdist-suite"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist-unpacked"
          SDIST_ROOT=$(find "$RUNNER_TEMP/sdist-unpacked" \
            -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$SDIST_ROOT/tests/external_analyzer_fixture.py"
          cp -R "$SDIST_ROOT/tests" "$SDIST_ROOT/examples" \
            "$RUNNER_TEMP/sdist-suite/"
          cd "$RUNNER_TEMP/sdist-suite"
          "$RUNNER_TEMP/datatrawl-sdist/bin/python" -m pytest -q

      - name: Verify the survey dependency contract
        run: |
          python -m pip install -e ".[survey,dev]"
          python - <<'PY'
          from datatrawl.plugins.sources._datatrail import Datatrail

          assert Datatrail.installed()
          ok, detail = Datatrail.api_available()
          assert ok, detail
          PY

      - name: Retain validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: datatrawl-distributions
          path: dist/*
          if-no-files-found: error
